<svg width="260" height="120" viewBox="0 0 260 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background bubble -->
  <rect x="0" y="0" width="260" height="120" rx="20" fill="#FDE2E4"/>

  <!-- Text -->
  <text x="130" y="55" font-family="Quicksand" font-size="28" fill="#6D597A" text-anchor="middle">
    Sing Sign Play
  </text>

  <!-- Adult hand (forming S idea) -->
  <circle cx="60" cy="85" r="18" fill="#F9C6D0"/>
  <rect x="50" y="65" width="20" height="25" rx="10" fill="#F9C6D0"/>

  <!-- Baby hand (forming P idea) -->
  <circle cx="200" cy="85" r="14" fill="#F7A9C4"/>
  <rect x="190" y="65" width="20" height="20" rx="10" fill="#F7A9C4"/>
</svg>
