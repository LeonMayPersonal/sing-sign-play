<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect x="0" y="0" width="1000" height="260" rx="50" fill="white"/>

  <!-- Adult hand (left) -->
  <g transform="translate(100,150)">
    <path d="M0,0 C-20,-40 40,-40 20,0 Z" fill="#F9C6D0"/>
  </g>

  <!-- Baby hand (right) -->
  <g transform="translate(900,150)">
    <path d="M0,0 C-15,-30 30,-30 15,0 Z" fill="#C8A2C8"/>
  </g>

  <!-- Text -->
  <text x="500" y="140" font-family="Quicksand" font-size="80" text-anchor="middle" fill="#6D597A">
    Sing Sign Play
  </text>

  <!-- Musical notes -->
  <text x="150" y="80" font-family="Quicksand" font-size="40" fill="#F7A9C4">♪</text>
  <text x="850" y="80" font-family="Quicksand" font-size="40" fill="#F7A9C4">♫</text>

</svg>
